# Render Blueprint — deploys the backend + PostgreSQL together.
# Usage: Render Dashboard → New → Blueprint → point at this repo.
# Vars marked `sync: false` must be filled in manually in the Render dashboard
# after the blueprint creates the service (they're secrets / deploy-specific).

services:
  - type: web
    name: ai-venture-analyst-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-venture-analyst-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: OPENAI_API_KEY
        sync: false          # paste your key in the Render dashboard
      - key: OPENAI_CHAT_MODEL
        value: gpt-4.1
      - key: OPENAI_EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: UPLOAD_DIR
        value: uploads
      - key: MAX_UPLOAD_MB
        value: "25"
      - key: FRONTEND_ORIGIN
        sync: false          # set to your Vercel URL once the frontend is deployed

databases:
  - name: ai-venture-analyst-db
    plan: free
    databaseName: venture_analyst
    user: venture_analyst_user
